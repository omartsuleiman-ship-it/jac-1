name: Build Unsigned IPA (AltStore)

on:
  workflow_dispatch: {}

jobs:
  build-unsigned-ipa:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Verify active Xcode version
        run: |
          xcode-select -p
          xcodebuild -version

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Prebuild native iOS project
        run: npx expo prebuild --platform ios --clean --non-interactive

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: pod install --repo-update

      - name: Detect Xcode scheme
        id: scheme
        working-directory: ios
        run: |
          WORKSPACE=$(ls | grep .xcworkspace | head -n 1)
          echo "--- All schemes found ---"
          xcodebuild -workspace "$WORKSPACE" -list -json

          PROJECT_NAME=$(ls | grep .xcodeproj | head -n 1 | sed 's/\.xcodeproj//')
          echo "Project name detected: $PROJECT_NAME"
          export PROJECT_NAME

          SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list -json | \
            ruby -rjson -e '
              data = JSON.parse(STDIN.read)
              schemes = data["workspace"]["schemes"]
              project = ENV["PROJECT_NAME"]
              match = schemes.find { |s| s == project }
              match ||= schemes.reject { |s| s.include?("Pods") || s.start_with?("React") || s.start_with?("Expo") || s.start_with?("RCT") }.first
              puts match
            ')

          if [ -z "$SCHEME" ]; then
            echo "Could not confidently detect app scheme. Full scheme list was:"
            xcodebuild -workspace "$WORKSPACE" -list
            exit 1
          fi

          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "name=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "Detected workspace: $WORKSPACE, scheme: $SCHEME"

      - name: Build unsigned .app (device architecture, no signing)
        id: build
        working-directory: ios
        env:
          SENTRY_DISABLE_AUTO_UPLOAD: true
        run: |
          set -o pipefail
          xcodebuild \
            -workspace "${{ steps.scheme.outputs.workspace }}" \
            -scheme "${{ steps.scheme.outputs.name }}" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            clean build | tee xcodebuild.log

          BUILT_PRODUCTS_DIR=$(xcodebuild \
            -workspace "${{ steps.scheme.outputs.workspace }}" \
            -scheme "${{ steps.scheme.outputs.name }}" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -showBuildSettings 2>/dev/null | grep -m1 "BUILT_PRODUCTS_DIR" | sed 's/^[^=]*= //')

          echo "Resolved BUILT_PRODUCTS_DIR: $BUILT_PRODUCTS_DIR"
          echo "built_products_dir=$BUILT_PRODUCTS_DIR" >> "$GITHUB_OUTPUT"

      - name: Package Payload and zip into .ipa
        working-directory: ios
        run: |
          echo "--- Searching for .app anywhere under build/ ---"
          find build -iname "*.app" -type d || true

          APP_PATH=$(find "${{ steps.build.outputs.built_products_dir }}" -maxdepth 1 -iname "*.app" -type d 2>/dev/null | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "Not found via BUILT_PRODUCTS_DIR, falling back to full recursive search under build/"
            APP_PATH=$(find build -iname "*.app" -type d | head -n 1)
          fi

          if [ -z "$APP_PATH" ]; then
            echo "No .app bundle found anywhere under build/. Full tree for debugging:"
            find build -maxdepth 5 -type d
            exit 1
          fi

          echo "Found app bundle: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          # Use ditto instead of zip: zip can mangle resource forks / extended
          # attributes on macOS runners, which produces an .ipa whose Info.plist
          # AltServer can't parse (NSCocoaErrorDomain 3840). ditto is what Apple's
          # own tooling uses to package .app bundles and avoids that corruption.
          ditto -c -k --sequesterRsrc --keepParent Payload app-unsigned.ipa
          mkdir -p ../artifact-output
          mv app-unsigned.ipa ../artifact-output/

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-unsigned-ipa
          path: artifact-output/app-unsigned.ipa
          retention-days: 14